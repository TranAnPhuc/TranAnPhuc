<svg width="640" height="896" viewBox="0 0 640 896" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0518" />
      <stop offset="55%" stop-color="#2D1B4E" />
      <stop offset="100%" stop-color="#140A26" />
    </linearGradient>
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE98A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6A14" />
    </linearGradient>
    <linearGradient id="nameBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9C64B" />
      <stop offset="50%" stop-color="#FFE98A" />
      <stop offset="100%" stop-color="#C79A2E" />
    </linearGradient>
    <radialGradient id="artBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#241440" />
      <stop offset="60%" stop-color="#160A28" />
      <stop offset="100%" stop-color="#0A0414" />
    </radialGradient>
    <linearGradient id="holoSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="artClip">
      <rect x="34" y="118" width="572" height="452" rx="6" />
    </clipPath>
  </defs>

  <!-- outer card -->
  <rect x="8" y="8" width="624" height="880" rx="26" fill="url(#cardBg)" stroke="url(#frameGold)" stroke-width="10">
    <animate attributeName="stroke-width" values="10;13;10" dur="3.5s" repeatCount="indefinite" />
  </rect>
  <rect x="22" y="22" width="596" height="852" rx="18" fill="none" stroke="#8A6A14" stroke-width="2" opacity="0.6" />

  <!-- name box -->
  <rect x="32" y="30" width="576" height="52" rx="8" fill="url(#nameBarGrad)" stroke="#5B4418" stroke-width="2" />
  <text x="52" y="66" fill="#1A0B2E" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="1">TRAN AN PHUC</text>

  <!-- attribute icon (top-right corner, overlapping name box) -->
  <circle cx="582" cy="56" r="27" fill="#1A0B2E" stroke="url(#frameGold)" stroke-width="4" />
  <text x="582" y="64" text-anchor="middle" fill="#FFE98A" font-family="Consolas, monospace" font-size="18" font-weight="700">&lt;/&gt;</text>

  <!-- level stars (right-aligned, between name box and artwork) -->
  <text x="600" y="106" text-anchor="end" fill="#FFE98A" font-family="Georgia, serif" font-size="24" letter-spacing="2">★★★★★★★★
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite" />
  </text>

  <!-- art box -->
  <rect x="34" y="118" width="572" height="452" rx="6" fill="url(#artBg)" stroke="url(#frameGold)" stroke-width="4" />
  <g clip-path="url(#artClip)">
    <!-- card artwork -->
    <image href="bunny-usagi.jpg" x="34" y="118" width="572" height="452" preserveAspectRatio="xMidYMid slice" />

    <!-- starfield sparkle overlay -->
    <circle cx="80" cy="150" r="2" fill="#FFE98A"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite" /></circle>
    <circle cx="520" cy="180" r="2" fill="#FFE98A"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite" /></circle>
    <circle cx="150" cy="150" r="2" fill="#FFE98A"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" /></circle>
    <circle cx="470" cy="540" r="2" fill="#FFE98A"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" /></circle>
    <circle cx="300" cy="140" r="2" fill="#FFE98A"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite" /></circle>
  </g>
  <!-- holo sweep -->
  <g clip-path="url(#artClip)">
    <rect x="-200" y="118" width="200" height="452" fill="url(#holoSweep)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="-100,0;900,0" dur="4s" repeatCount="indefinite" additive="sum" />
    </rect>
  </g>

  <!-- type line -->
  <rect x="34" y="580" width="572" height="30" fill="#1A0B2E" stroke="#8A6A14" stroke-width="1.5" />
  <text x="46" y="601" fill="#FFE98A" font-family="Georgia, serif" font-size="16" font-style="italic">[ Full-Stack Developer / Effect ]</text>

  <!-- effect text box -->
  <rect x="34" y="616" width="572" height="186" rx="6" fill="#140A26" stroke="#8A6A14" stroke-width="1.5" />
  <text x="50" y="644" fill="#E6DAF5" font-family="Georgia, serif" font-size="15">This card cannot be Normal Summoned. It must first</text>
  <text x="50" y="666" fill="#E6DAF5" font-family="Georgia, serif" font-size="15">master "TypeScript", "React", "Next.js", "Node.js"</text>
  <text x="50" y="688" fill="#E6DAF5" font-family="Georgia, serif" font-size="15">and "PostgreSQL". While on the field, it gains ATK</text>
  <text x="50" y="710" fill="#E6DAF5" font-family="Georgia, serif" font-size="15">from enterprise backend training in C# / ASP.NET</text>
  <text x="50" y="732" fill="#E6DAF5" font-family="Georgia, serif" font-size="15">Core at Quang Viet Long An Company, boosting its</text>
  <text x="50" y="754" fill="#E6DAF5" font-family="Georgia, serif" font-size="15">Clean Architecture and Data-Integrity stats.</text>
  <text x="50" y="786" fill="#FFE98A" font-family="Consolas, monospace" font-size="14">Summon: anphuctran24@gmail.com</text>

  <!-- stats -->
  <text x="586" y="846" text-anchor="end" fill="#FFE98A" font-family="Georgia, serif" font-weight="700" font-size="24">ATK/9999&#160;&#160;DEF/9999</text>
  <text x="46" y="846" fill="#8A6A14" font-family="Consolas, monospace" font-size="14">APD-EN001 · github.com/anphuctran2005</text>
</svg>
