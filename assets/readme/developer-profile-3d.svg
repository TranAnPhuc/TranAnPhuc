<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="stroke-card-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="stroke-card-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="stroke-card-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="profile-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="940" height="210" rx="14" fill="#08090D" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1.2"/>
  <rect width="940" height="210" rx="14" fill="url(#profile-grid)"/>

  <!-- Top Matrix Indicator -->
  <g class="font-mono" font-size="10" letter-spacing="1.5">
    <text x="24" y="24" fill="#06B6D4" font-weight="bold">
      [01] // DEVELOPER PROFILE MATRIX
    </text>
    <text x="916" y="24" text-anchor="end" fill="#94A3B8">
      STATUS: <tspan fill="#06B6D4">ACTIVE DIRECTORY</tspan>
    </text>
  </g>

  <!-- CARD 1: Full-stack Core -->
  <g transform="translate(24, 40)" filter="url(#card-shadow)">
    <rect width="280" height="150" rx="10" fill="url(#card-bg)" stroke="url(#stroke-card-1)" stroke-width="1.2"/>
    <path d="M 6 12 L 6 6 L 12 6" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="14" y="14" width="76" height="18" rx="4" fill="#0E1E2B" stroke="#06B6D4" stroke-width="0.8"/>
    <text x="52" y="27" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#06B6D4" letter-spacing="1">MODERN STACK</text>

    <text x="14" y="52" class="font-sans" font-size="14" font-weight="800" fill="#F8FAFC">Full-Stack Engineer</text>
    <text x="14" y="68" class="font-mono" font-size="10" fill="#38BDF8">JavaScript · TypeScript Core</text>

    <line x1="14" y1="80" x2="266" y2="80" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1"/>

    <text x="14" y="100" class="font-sans" font-size="11" fill="#94A3B8">Primary direction focused on React,</text>
    <text x="14" y="116" class="font-sans" font-size="11" fill="#94A3B8">Next.js, Node.js, and PostgreSQL.</text>
    <text x="14" y="134" class="font-sans" font-size="10" font-weight="600" fill="#E2E8F0">Architecture · Scalability · Modern UI</text>
  </g>

  <!-- CARD 2: Enterprise Heritage -->
  <g transform="translate(330, 40)" filter="url(#card-shadow)">
    <rect width="280" height="150" rx="10" fill="url(#card-bg)" stroke="url(#stroke-card-2)" stroke-width="1.2"/>
    <path d="M 6 12 L 6 6 L 12 6" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="14" y="14" width="88" height="18" rx="4" fill="#1E1430" stroke="#7C3AED" stroke-width="0.8"/>
    <text x="58" y="27" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#A855F7" letter-spacing="1">ENTERPRISE BASE</text>

    <text x="14" y="52" class="font-sans" font-size="14" font-weight="800" fill="#F8FAFC">Enterprise Reliability</text>
    <text x="14" y="68" class="font-mono" font-size="10" fill="#A855F7">C# · ASP.NET Core · SQL Server</text>

    <line x1="14" y1="80" x2="266" y2="80" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1"/>

    <text x="14" y="100" class="font-sans" font-size="11" fill="#94A3B8">Hands-on enterprise foundation with</text>
    <text x="14" y="116" class="font-sans" font-size="11" fill="#94A3B8">Dapper &amp; high-integrity workflows.</text>
    <text x="14" y="134" class="font-sans" font-size="10" font-weight="600" fill="#E2E8F0">Discipline · Clean Code · Domain Logic</text>
  </g>

  <!-- CARD 3: AI-Assisted Engineering -->
  <g transform="translate(636, 40)" filter="url(#card-shadow)">
    <rect width="280" height="150" rx="10" fill="url(#card-bg)" stroke="url(#stroke-card-3)" stroke-width="1.2"/>
    <path d="M 6 12 L 6 6 L 12 6" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <rect x="14" y="14" width="84" height="18" rx="4" fill="#0E231B" stroke="#10B981" stroke-width="0.8"/>
    <text x="56" y="27" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#10B981" letter-spacing="1">AI AUGMENTED</text>

    <text x="14" y="52" class="font-sans" font-size="14" font-weight="800" fill="#F8FAFC">AI-Assisted Workflow</text>
    <text x="14" y="68" class="font-mono" font-size="10" fill="#10B981">Agents · Tooling · Automation</text>

    <line x1="14" y1="80" x2="266" y2="80" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1"/>

    <text x="14" y="100" class="font-sans" font-size="11" fill="#94A3B8">Accelerates delivery while keeping deep</text>
    <text x="14" y="116" class="font-sans" font-size="11" fill="#94A3B8">comprehension and architectural control.</text>
    <text x="14" y="134" class="font-sans" font-size="10" font-weight="600" fill="#E2E8F0">High Velocity · Full Code Ownership</text>
  </g>
</svg>
