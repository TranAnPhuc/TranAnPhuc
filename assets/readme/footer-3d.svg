<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 120" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="50%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>

    <linearGradient id="footer-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <pattern id="footer-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="940" height="120" rx="14" fill="url(#footer-bg)" stroke="#7C3AED" stroke-opacity="0.25" stroke-width="1.2"/>
  <rect width="940" height="120" rx="14" fill="url(#footer-grid)"/>

  <!-- Corner Brackets -->
  <g stroke="#06B6D4" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <path d="M 16 28 L 16 16 L 28 16"/>
    <path d="M 924 28 L 924 16 L 912 16"/>
    <path d="M 16 92 L 16 104 L 28 104"/>
    <path d="M 924 92 L 924 104 L 912 104"/>
  </g>

  <!-- Center Content -->
  <g text-anchor="middle">
    <!-- Telemetry Status Line -->
    <text x="470" y="38" class="font-mono" font-size="9.5" fill="#94A3B8" letter-spacing="2">
      <tspan fill="#10B981">●</tspan> WORKSPACE CONCLUDED <tspan fill="#7C3AED">//</tspan> CONTINUOUS INTEGRATION: ACTIVE
    </text>

    <!-- Main Footer Motto -->
    <text x="470" y="68" class="font-sans" font-size="16" font-weight="900" fill="url(#footer-text-grad)" letter-spacing="4">
      BUILD · ARCHITECT · REFINE · DELIVER
    </text>

    <!-- Copyright / Identity -->
    <text x="470" y="92" class="font-mono" font-size="10" fill="#64748B" letter-spacing="1.5">
      TRAN AN PHUC © 2026 // DESIGNED WITH 3D AI WORKSPACE SPEC
    </text>
  </g>
</svg>
