<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 215" width="100%" height="100%">
  <defs>
    <linearGradient id="pipe-step-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131A" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="quote-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="step-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="phi-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="940" height="215" rx="14" fill="#08090D" stroke="#7C3AED" stroke-opacity="0.25" stroke-width="1.2"/>
  <rect width="940" height="215" rx="14" fill="url(#phi-grid)"/>

  <!-- Top Header HUD -->
  <g class="font-mono" font-size="10" letter-spacing="1.5">
    <text x="24" y="24" fill="#06B6D4" font-weight="bold">
      [06] // ENGINEERING PHILOSOPHY &amp; AI PIPELINE
    </text>
    <text x="916" y="24" text-anchor="end" fill="#94A3B8">
      DISCIPLINE: <tspan fill="#38BDF8">COMPREHENSION &gt; GENERATION</tspan>
    </text>
  </g>

  <!-- Quote Banner -->
  <g transform="translate(24, 36)">
    <rect width="892" height="42" rx="8" fill="url(#quote-bg)" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.4"/>
    <text x="446" y="26" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#F8FAFC" letter-spacing="0.4">
      &#8220;Use AI to accelerate development, but understand the code well enough to maintain it without AI.&#8221;
    </text>
  </g>

  <!-- Pipeline Connector Bus Behind Nodes -->
  <line x1="70" y1="140" x2="870" y2="140" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- ================= 8 PIPELINE NODES ================= -->

  <!-- Step 01: Problem -->
  <g transform="translate(24, 96)" filter="url(#step-shadow)">
    <rect width="96" height="92" rx="8" fill="url(#pipe-step-bg)" stroke="#06B6D4" stroke-width="1.2"/>
    <text x="48" y="22" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#06B6D4">STEP 01</text>
    <circle cx="48" cy="40" r="10" fill="#0E2F3D"/>
    <text x="48" y="44" text-anchor="middle" class="font-mono" font-size="10" fill="#06B6D4">01</text>
    <text x="48" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#F8FAFC">Problem</text>
    <text x="48" y="78" text-anchor="middle" class="font-mono" font-size="7.5" fill="#94A3B8">Definition</text>
  </g>

  <!-- Step 02: Explore -->
  <g transform="translate(138, 96)" filter="url(#step-shadow)">
    <rect width="96" height="92" rx="8" fill="url(#pipe-step-bg)" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="48" y="22" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#38BDF8">STEP 02</text>
    <circle cx="48" cy="40" r="10" fill="#082F49"/>
    <text x="48" y="44" text-anchor="middle" class="font-mono" font-size="10" fill="#38BDF8">02</text>
    <text x="48" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#F8FAFC">Explore</text>
    <text x="48" y="78" text-anchor="middle" class="font-mono" font-size="7.5" fill="#94A3B8">AI Ideation</text>
  </g>

  <!-- Step 03: Design -->
  <g transform="translate(252, 96)" filter="url(#step-shadow)">
    <rect width="96" height="92" rx="8" fill="url(#pipe-step-bg)" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="48" y="22" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#C084FC">STEP 03</text>
    <circle cx="48" cy="40" r="10" fill="#2E1065"/>
    <text x="48" y="44" text-anchor="middle" class="font-mono" font-size="10" fill="#C084FC">03</text>
    <text x="48" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#F8FAFC">Design</text>
    <text x="48" y="78" text-anchor="middle" class="font-mono" font-size="7.5" fill="#94A3B8">Architecture</text>
  </g>

  <!-- Step 04: Implement -->
  <g transform="translate(366, 96)" filter="url(#step-shadow)">
    <rect width="96" height="92" rx="8" fill="url(#pipe-step-bg)" stroke="#06B6D4" stroke-width="1.2"/>
    <text x="48" y="22" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#06B6D4">STEP 04</text>
    <circle cx="48" cy="40" r="10" fill="#0E2F3D"/>
    <text x="48" y="44" text-anchor="middle" class="font-mono" font-size="10" fill="#06B6D4">04</text>
    <text x="48" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#F8FAFC">Implement</text>
    <text x="48" y="78" text-anchor="middle" class="font-mono" font-size="7.5" fill="#94A3B8">Clean Code</text>
  </g>

  <!-- Step 05: Review -->
  <g transform="translate(480, 96)" filter="url(#step-shadow)">
    <rect width="96" height="92" rx="8" fill="url(#pipe-step-bg)" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="48" y="22" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#38BDF8">STEP 05</text>
    <circle cx="48" cy="40" r="10" fill="#082F49"/>
    <text x="48" y="44" text-anchor="middle" class="font-mono" font-size="10" fill="#38BDF8">05</text>
    <text x="48" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#F8FAFC">Review</text>
    <text x="48" y="78" text-anchor="middle" class="font-mono" font-size="7.5" fill="#94A3B8">Logic Audit</text>
  </g>

  <!-- Step 06: Test -->
  <g transform="translate(594, 96)" filter="url(#step-shadow)">
    <rect width="96" height="92" rx="8" fill="url(#pipe-step-bg)" stroke="#10B981" stroke-width="1.2"/>
    <text x="48" y="22" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#10B981">STEP 06</text>
    <circle cx="48" cy="40" r="10" fill="#064E3B"/>
    <text x="48" y="44" text-anchor="middle" class="font-mono" font-size="10" fill="#10B981">06</text>
    <text x="48" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#F8FAFC">Test</text>
    <text x="48" y="78" text-anchor="middle" class="font-mono" font-size="7.5" fill="#94A3B8">Verification</text>
  </g>

  <!-- Step 07: Refactor -->
  <g transform="translate(708, 96)" filter="url(#step-shadow)">
    <rect width="96" height="92" rx="8" fill="url(#pipe-step-bg)" stroke="#A855F7" stroke-width="1.2"/>
    <text x="48" y="22" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#C084FC">STEP 07</text>
    <circle cx="48" cy="40" r="10" fill="#2E1065"/>
    <text x="48" y="44" text-anchor="middle" class="font-mono" font-size="10" fill="#C084FC">07</text>
    <text x="48" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#F8FAFC">Refactor</text>
    <text x="48" y="78" text-anchor="middle" class="font-mono" font-size="7.5" fill="#94A3B8">Optimize</text>
  </g>

  <!-- Step 08: Document -->
  <g transform="translate(820, 96)" filter="url(#step-shadow)">
    <rect width="96" height="92" rx="8" fill="url(#pipe-step-bg)" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="48" y="22" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#38BDF8">STEP 08</text>
    <circle cx="48" cy="40" r="10" fill="#082F49"/>
    <text x="48" y="44" text-anchor="middle" class="font-mono" font-size="10" fill="#38BDF8">08</text>
    <text x="48" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#F8FAFC">Document</text>
    <text x="48" y="78" text-anchor="middle" class="font-mono" font-size="7.5" fill="#94A3B8">Knowledge</text>
  </g>
</svg>
