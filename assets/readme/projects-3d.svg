    <rect x="16" y="14" width="70" height="18" rx="4" fill="#2E1065"/>
    <text x="51" y="27" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#C084FC">EDTECH</text>

    <rect x="340" y="14" width="80" height="18" rx="9" fill="#0F172A" stroke="#A855F7" stroke-width="0.8"/>
    <circle cx="350" cy="23" r="3" fill="#10B981"/>
    <text x="388" y="26" text-anchor="middle" class="font-mono" font-size="8" fill="#F8FAFC">PUBLIC REPO</text>

    <!-- Project Title -->
    <text x="16" y="52" class="font-sans" font-size="16" font-weight="800" fill="#F8FAFC">Smart TOEIC 4-Skills</text>
    <text x="16" y="68" class="font-mono" font-size="9.5" fill="#A855F7">PURPOSE: Structured Exam Prep &amp; Analytics</text>

    <!-- Description -->
    <text x="16" y="90" class="font-sans" font-size="11" fill="#94A3B8">Comprehensive English testing platform featuring modular</text>
    <text x="16" y="106" class="font-sans" font-size="11" fill="#94A3B8">question banks, audio listening flows, and skill tracking.</text>

    <!-- Tech Pills -->
    <g transform="translate(16, 126)">
      <rect x="0" y="0" width="56" height="20" rx="4" fill="#1E293B"/>
      <text x="28" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#06B6D4">React</text>

      <rect x="62" y="0" width="70" height="20" rx="4" fill="#1E293B"/>
      <text x="97" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#38BDF8">TypeScript</text>

      <rect x="138" y="0" width="60" height="20" rx="4" fill="#064E3B"/>
      <text x="168" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#10B981">Node.js</text>

      <rect x="204" y="0" width="76" height="20" rx="4" fill="#2E1065"/>
      <text x="242" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#C084FC">PostgreSQL</text>
    </g>
  </g>

  <!-- ================= PROJECT 04: Improvement Proposal System ================= -->
  <g transform="translate(480, 228)" filter="url(#proj-shadow)">
    <rect width="436" height="175" rx="10" fill="url(#proj-card-bg)" stroke="url(#proj-border-4)" stroke-width="1.3"/>
    <path d="M 6 12 L 6 6 L 12 6" fill="none" stroke="#10B981" stroke-width="1.5"/>

    <!-- Category Pill & Status -->
    <rect x="16" y="14" width="84" height="18" rx="4" fill="#064E3B"/>
    <text x="58" y="27" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#34D399">ENTERPRISE</text>

    <rect x="330" y="14" width="90" height="18" rx="9" fill="#0F172A" stroke="#10B981" stroke-width="0.8"/>
    <circle cx="340" cy="23" r="3" fill="#38BDF8"/>
    <text x="380" y="26" text-anchor="middle" class="font-mono" font-size="8" fill="#F8FAFC">ENTERPRISE APP</text>

    <!-- Project Title -->
    <text x="16" y="52" class="font-sans" font-size="16" font-weight="800" fill="#F8FAFC">Improvement Proposal System</text>
    <text x="16" y="68" class="font-mono" font-size="9.5" fill="#10B981">PURPOSE: Internal Kaizen Automation &amp; Approvals</text>

    <!-- Description -->
    <text x="16" y="90" class="font-sans" font-size="11" fill="#94A3B8">Production system replacing manual paper proposals with</text>
    <text x="16" y="106" class="font-sans" font-size="11" fill="#94A3B8">multi-tier approval hierarchies, status audits, and KPI dashboards.</text>

    <!-- Tech Pills -->
    <g transform="translate(16, 126)">
      <rect x="0" y="0" width="36" height="20" rx="4" fill="#2E1065"/>
      <text x="18" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#C084FC">C#</text>

      <rect x="42" y="0" width="82" height="20" rx="4" fill="#2E1065"/>
      <text x="83" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#C084FC">ASP.NET Core</text>

      <rect x="130" y="0" width="76" height="20" rx="4" fill="#1E293B"/>
      <text x="168" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#38BDF8">SQL Server</text>

      <rect x="212" y="0" width="56" height="20" rx="4" fill="#082F49"/>
      <text x="240" y="14" text-anchor="middle" class="font-mono" font-size="8.5" fill="#06B6D4">Dapper</text>
    </g>
  </g>
</svg>
