  <!-- Background Canvas -->
  <rect width="940" height="390" rx="14" fill="#08090D" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1.2"/>
  <rect width="940" height="390" rx="14" fill="url(#stack-grid)"/>

  <!-- Section Header HUD -->
  <g class="font-mono" font-size="10" letter-spacing="1.5">
    <text x="24" y="24" fill="#06B6D4" font-weight="bold">
