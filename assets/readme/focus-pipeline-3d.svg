<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" height="100%">
  <defs>
    <linearGradient id="pipe-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="bus-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="pipe-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="940" height="220" rx="14" fill="#08090D" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1.2"/>
  <rect width="940" height="220" rx="14" fill="url(#pipe-grid)"/>

  <!-- Top Header HUD -->
  <g class="font-mono" font-size="10" letter-spacing="1.5">
    <text x="24" y="24" fill="#06B6D4" font-weight="bold">
      [03] // PROGRESSIVE DEVELOPMENT PIPELINE
    </text>
    <text x="916" y="24" text-anchor="end" fill="#94A3B8">
      TRAJECTORY: <tspan fill="#38BDF8">FOUNDATION → ARCHITECTURE → AI SYSTEMS</tspan>
    </text>
  </g>

  <!-- Connecting Bus Lines between Nodes -->
  <!-- Row 1 horizontal connectors -->
  <line x1="225" y1="78" x2="250" y2="78" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="252,78 245,74 245,82" fill="#06B6D4"/>

  <line x1="450" y1="78" x2="475" y2="78" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="477,78 470,74 470,82" fill="#38BDF8"/>

  <line x1="675" y1="78" x2="700" y2="78" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="702,78 695,74 695,82" fill="#7C3AED"/>

  <!-- Vertical Bridge from Row 1 to Row 2 -->
  <path d="M 800 115 L 800 145 Q 800 155 790 155 L 725 155" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="4,4"/>
  <polygon points="723,155 730,151 730,159" fill="#7C3AED"/>

  <!-- Row 2 reverse connectors -->
  <line x1="700" y1="168" x2="675" y2="168" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="673,168 680,164 680,172" fill="#7C3AED"/>

  <line x1="475" y1="168" x2="450" y2="168" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="448,168 455,164 455,172" fill="#06B6D4"/>

  <line x1="250" y1="168" x2="225" y2="168" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="223,168 230,164 230,172" fill="#38BDF8"/>

  <!-- ================= ROW 1 NODES ================= -->

  <!-- NODE 01: JavaScript -->
  <g transform="translate(24, 44)" filter="url(#node-glow)">
    <rect width="200" height="68" rx="8" fill="url(#pipe-card-bg)" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="12" y="22" class="font-mono" font-size="9" font-weight="700" fill="#06B6D4">PHASE 01</text>
    <circle cx="186" cy="18" r="3" fill="#06B6D4"/>
    <text x="12" y="42" class="font-sans" font-size="13" font-weight="800" fill="#F8FAFC">JavaScript</text>
    <text x="12" y="58" class="font-mono" font-size="9" fill="#94A3B8">Core Runtime · Event Loop</text>
  </g>

  <!-- NODE 02: TypeScript -->
  <g transform="translate(250, 44)" filter="url(#node-glow)">
    <rect width="200" height="68" rx="8" fill="url(#pipe-card-bg)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="12" y="22" class="font-mono" font-size="9" font-weight="700" fill="#38BDF8">PHASE 02</text>
    <circle cx="186" cy="18" r="3" fill="#38BDF8"/>
    <text x="12" y="42" class="font-sans" font-size="13" font-weight="800" fill="#F8FAFC">TypeScript</text>
    <text x="12" y="58" class="font-mono" font-size="9" fill="#94A3B8">Static Typing · Generics</text>
  </g>

  <!-- NODE 03: React / Next.js -->
  <g transform="translate(475, 44)" filter="url(#node-glow)">
    <rect width="200" height="68" rx="8" fill="url(#pipe-card-bg)" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="12" y="22" class="font-mono" font-size="9" font-weight="700" fill="#06B6D4">PHASE 03</text>
    <circle cx="186" cy="18" r="3" fill="#06B6D4"/>
    <text x="12" y="42" class="font-sans" font-size="13" font-weight="800" fill="#F8FAFC">React / Next.js</text>
    <text x="12" y="58" class="font-mono" font-size="9" fill="#94A3B8">App Router · Components</text>
  </g>

  <!-- NODE 04: Node.js -->
  <g transform="translate(700, 44)" filter="url(#node-glow)">
    <rect width="215" height="68" rx="8" fill="url(#pipe-card-bg)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="12" y="22" class="font-mono" font-size="9" font-weight="700" fill="#10B981">PHASE 04</text>
    <circle cx="201" cy="18" r="3" fill="#10B981"/>
    <text x="12" y="42" class="font-sans" font-size="13" font-weight="800" fill="#F8FAFC">Node.js Services</text>
    <text x="12" y="58" class="font-mono" font-size="9" fill="#94A3B8">APIs &amp; Microservices</text>
  </g>

  <!-- ================= ROW 2 NODES (Progression Continues) ================= -->

  <!-- NODE 05: PostgreSQL -->
  <g transform="translate(700, 134)" filter="url(#node-glow)">
    <rect width="215" height="68" rx="8" fill="url(#pipe-card-bg)" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="12" y="22" class="font-mono" font-size="9" font-weight="700" fill="#A855F7">PHASE 05</text>
    <circle cx="201" cy="18" r="3" fill="#A855F7"/>
    <text x="12" y="42" class="font-sans" font-size="13" font-weight="800" fill="#F8FAFC">PostgreSQL</text>
    <text x="12" y="58" class="font-mono" font-size="9" fill="#94A3B8">Relational Data &amp; ACID</text>
  </g>

  <!-- NODE 06: System Design -->
  <g transform="translate(475, 134)" filter="url(#node-glow)">
    <rect width="200" height="68" rx="8" fill="url(#pipe-card-bg)" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="12" y="22" class="font-mono" font-size="9" font-weight="700" fill="#C084FC">PHASE 06</text>
    <circle cx="186" cy="18" r="3" fill="#7C3AED"/>
    <text x="12" y="42" class="font-sans" font-size="13" font-weight="800" fill="#F8FAFC">System Design</text>
    <text x="12" y="58" class="font-mono" font-size="9" fill="#94A3B8">Scalability &amp; Modularity</text>
  </g>

  <!-- NODE 07: AI Agents -->
  <g transform="translate(250, 134)" filter="url(#node-glow)">
    <rect width="200" height="68" rx="8" fill="url(#pipe-card-bg)" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="12" y="22" class="font-mono" font-size="9" font-weight="700" fill="#06B6D4">PHASE 07</text>
    <circle cx="186" cy="18" r="3" fill="#06B6D4"/>
    <text x="12" y="42" class="font-sans" font-size="13" font-weight="800" fill="#F8FAFC">AI Agents</text>
    <text x="12" y="58" class="font-mono" font-size="9" fill="#94A3B8">Autonomous Workflows</text>
  </g>

  <!-- NODE 08: SaaS / Automation -->
  <g transform="translate(24, 134)" filter="url(#node-glow)">
    <rect width="200" height="68" rx="8" fill="url(#pipe-card-bg)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="12" y="22" class="font-mono" font-size="9" font-weight="700" fill="#38BDF8">PHASE 08</text>
    <circle cx="186" cy="18" r="3" fill="#38BDF8"/>
    <text x="12" y="42" class="font-sans" font-size="13" font-weight="800" fill="#F8FAFC">SaaS &amp; Automation</text>
    <text x="12" y="58" class="font-mono" font-size="9" fill="#94A3B8">Production Solutions</text>
  </g>
</svg>
